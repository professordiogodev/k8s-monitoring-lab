# 📬 A pretend "pager": a tiny HTTP server that prints every webhook it receives.
# Used by the alerting lab (labs/05-alerting.md). Code comes from app/webhook_sink.py via a ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sink
  namespace: pizza
  labels: {app: webhook-sink}
spec:
  replicas: 1
  selector:
    matchLabels: {app: webhook-sink}
  template:
    metadata:
      labels: {app: webhook-sink}
    spec:
      containers:
        - name: sink
          image: python:3.12-alpine
          command: ["python", "-u", "/app/webhook_sink.py"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
          volumeMounts: [{name: code, mountPath: /app}]
      volumes:
        - name: code
          configMap: {name: webhook-sink-code}
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-sink
  namespace: pizza
spec:
  selector: {app: webhook-sink}
  ports: [{port: 8080, targetPort: 8080}]
