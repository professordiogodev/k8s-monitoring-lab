# Grafana Alloy as a DaemonSet: one pod per node tails container logs and ships them to Loki.
# (Promtail is end-of-life; Alloy is its successor.)
controller:
  type: daemonset
alloy:
  mounts:
    varlog: true
  configMap:
    content: |
      // 1. discover every pod in the cluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. turn k8s metadata into Loki labels (keep the set SMALL - cardinality!)
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      // 3. tail the logs through the Kubernetes API
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // 4. ship to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
rbac: {create: true}
