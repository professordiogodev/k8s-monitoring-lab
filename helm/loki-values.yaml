# Loki in the simplest possible shape: ONE pod, filesystem storage, no auth.
# Great for labs. NOT for production (use object storage + simple-scalable/distributed).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
singleBinary:
  replicas: 1
  persistence:
    enabled: true               # Loki needs a writable /var/loki. A tiny PVC (local-path) does the job.
    size: 2Gi
# turn off everything that isn't the single binary
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
gateway: {enabled: false}
test: {enabled: false}
lokiCanary: {enabled: false}
monitoring:
  selfMonitoring: {enabled: false}
  serviceMonitor: {enabled: false}
